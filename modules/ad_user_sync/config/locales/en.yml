---
en:
  ad_user_sync:
    send_to_inbox:
      menu_label: "Send to inbox"
      title: "Send to inbox"
      explanation: >-
        Creates a work package in the private My inbox project of the recipient and assigns it to them.
        You can follow its progress and comment on it, but you do not get access to anything else in the inbox.
      recipient: "Recipient"
      subject: "Subject"
      description: "Description"
      due_date: "Due date"
      submit: "Send"
      success: "Work package #%{id} \"%{subject}\" was sent to the inbox."
      errors:
        not_allowed: "You are not allowed to send work packages."
        invalid_recipient: "Please choose another recipient."
        subject_blank: "Subject can't be blank."
        no_inbox: "%{name} has no inbox yet."
        sharing_unavailable: "Work package sharing is not available, so the work package could not be sent."
        role_missing: "The \"Work package commenter\" role does not exist, so the work package could not be sent."
